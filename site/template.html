<title>Stock Picker Portal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a market terminal — sticky top bar, one content column, dense tables with tabular figures */
:root {
  --bg: #f6f7f5; --panel: #ffffff; --ink: #14201c; --muted: #5d6b66; --line: #dde3e0;
  --accent: #0d5c4a; --accent-ink: #ffffff; --soft: #eef2f0;
  --up: #12733f; --up-bg: #e2f3e8; --down: #b42318; --down-bg: #fbe7e5; --warn-bg: #fdf3dc; --warn: #8a5a00;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1513; --panel: #161e1b; --ink: #e6ede9; --muted: #95a49e; --line: #2a3531;
  --accent: #4fc3a1; --accent-ink: #062a21; --soft: #1d2723;
  --up: #5bd08a; --up-bg: #163324; --down: #ff8a80; --down-bg: #3a1d1b; --warn-bg: #3a2f14; --warn: #f2c66d; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1513; --panel: #161e1b; --ink: #e6ede9; --muted: #95a49e; --line: #2a3531;
  --accent: #4fc3a1; --accent-ink: #062a21; --soft: #1d2723;
  --up: #5bd08a; --up-bg: #163324; --down: #ff8a80; --down-bg: #3a1d1b; --warn-bg: #3a2f14; --warn: #f2c66d; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel) }
a { color: var(--accent) }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line) }
header.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; padding-block: 10px }
.brand { font-weight: 700; color: var(--ink); text-decoration: none; letter-spacing: -0.01em }
nav.tabs { display: flex; gap: 14px; flex-wrap: wrap }
nav.tabs a { color: var(--muted); text-decoration: none; font-weight: 500 }
nav.tabs a[aria-current="page"] { color: var(--ink); text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 2px; text-decoration-color: var(--accent) }
.fresh { margin-left: auto; font-size: 12px; color: var(--muted) }
main { padding-block: 18px 40px; display: grid; gap: 14px }
h1 { font-size: 22px; line-height: 1.25; margin: 0; text-wrap: balance }
h2 { font-size: 15px; margin: 0 0 2px; }
.sub { color: var(--muted); font-size: 12px; margin: 0 }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; min-width: 0 }
.grid { display: grid; gap: 8px }
.tiles { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)) }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; min-width: 0 }
.tile .lbl { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px }
.tile .val { font: 500 17px/1.3 var(--mono) }
.num, td.num, th.num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap }
.up { color: var(--up) } .down { color: var(--down) } .flat { color: var(--muted) }
.small { font-size: 12px } .tiny { font-size: 11px; color: var(--muted) }
.src { font-size: 11px; color: var(--muted); margin: 8px 0 0 }
.scroll { overflow-x: auto }
table { width: 100%; border-collapse: collapse }
th { font-size: 12px; font-weight: 500; color: var(--muted); text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap }
td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top }
tr:last-child td { border-bottom: 0 }
th button { all: unset; cursor: pointer } th button:hover { color: var(--ink) }
.name { font-weight: 600 } .name a { color: var(--ink); text-decoration: none } .name a:hover { text-decoration: underline }
.co { font-size: 12px; color: var(--muted); max-width: 22rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.ex { font-size: 10px; color: var(--muted); margin-left: 4px; font-weight: 400 }
.pill { display: inline-block; font-size: 11px; font-weight: 600; border-radius: 99px; padding: 1px 8px; white-space: nowrap }
.pill.tailwind, .pill.positive, .pill.good { background: var(--up-bg); color: var(--up) }
.pill.headwind, .pill.negative, .pill.bad { background: var(--down-bg); color: var(--down) }
.pill.neutral, .pill.na { background: var(--soft); color: var(--muted) }
.live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--up); margin-right: 4px; vertical-align: 1px }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px }
input[type=search], select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px }
input[type=search] { flex: 1 1 240px; min-width: 0 }
.btn { font: inherit; font-weight: 500; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 5px 12px; cursor: pointer }
.btn[disabled] { opacity: .4; cursor: default }
.btn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.pager { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 8px }
.two { display: grid; gap: 14px; grid-template-columns: 1fr 1fr } @media (max-width: 760px) { .two { grid-template-columns: 1fr } }
.movers li { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0 } .movers ol { margin: 0; padding: 0; list-style: none }
.verdict { border: 2px solid var(--line); background: var(--panel); border-radius: 8px; padding: 16px }
.verdict.positive { border-color: var(--up) } .verdict.negative { border-color: var(--down) }
.verdict .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.verdict p.big { font-size: 17px; font-weight: 600; margin: 4px 0 8px; text-wrap: balance }
.verdict ul { margin: 0; padding-left: 20px } .verdict li { margin: 2px 0 }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px } .chip { font-size: 12px; background: var(--soft); border-radius: 4px; padding: 3px 8px }
.stats { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)) }
.stat { background: var(--soft); border-radius: 6px; padding: 8px 10px } .stat .k { font-size: 11px; color: var(--muted) } .stat .v { font: 500 14px var(--mono) }
.levels { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin: 0; padding: 0; list-style: none }
.levels li { background: var(--soft); border-radius: 6px; padding: 8px 10px }
.notice { background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 10px 12px; font-size: 13px }
.ranges { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap }
.chart svg { display: block; width: 100%; height: auto }
.news li { display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line) } .news li:last-child { border: 0 } .news ul { list-style: none; margin: 0; padding: 0 }
.cards { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)) }
.card { display: block; text-decoration: none; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px }
.card:hover { border-color: var(--accent) }
.bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--soft); margin-top: 8px }
.bar span { display: block } .bar .t { background: var(--up) } .bar .h { background: var(--down) }
.loading { color: var(--muted) }
.live-box { border: 2px solid var(--accent); border-radius: 8px; background: var(--panel); padding: 14px; display: grid; gap: 12px }
.live-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; padding: 8px 16px }
.steps { font-size: 13px; color: var(--muted) } .spinner { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--accent); border-right-color: transparent; animation: spin 1s linear infinite; margin-right: 6px; vertical-align: -1px }
@keyframes spin { to { transform: rotate(360deg) } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none } }
.grade { font: 700 34px/1 var(--mono); padding: 8px 14px; border-radius: 8px; background: var(--soft) }
.grade.A, .grade.B { background: var(--up-bg); color: var(--up) } .grade.D, .grade.E { background: var(--down-bg); color: var(--down) }
.qa { display: grid; gap: 10px } .qa .q { font-weight: 600 } .qa .a { white-space: pre-wrap } .qa .s { font-size: 11px }
details.sec { border-top: 1px solid var(--line); padding-top: 8px } details.sec summary { cursor: pointer; font-weight: 600 }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px }
.idea { border-left: 4px solid var(--accent); background: var(--soft); padding: 10px 12px; border-radius: 4px }
.idea.up { border-left-color: var(--up) } .idea.down { border-left-color: var(--down) }
footer { font-size: 12px; color: var(--muted); padding-block: 0 30px }
@media (prefers-reduced-motion: no-preference) { .tile, .card { transition: border-color .15s } }
</style>

<header class="top"><div class="wrap">
  <a class="brand" href="#market">Stock Picker Portal</a>
  <nav class="tabs" aria-label="Sections">
    <a href="#market" data-tab="market">Market</a>
    <a href="#investing" data-tab="investing">Investing</a>
    <a href="#industries" data-tab="industries">Industries</a>
    <a href="#economy" data-tab="economy">Economy</a>
    <a href="#trading" data-tab="trading">Market pulse</a>
  </nav>
  <span class="fresh" id="fresh">Loading data…</span>
</div></header>

<main class="wrap" id="app"><p class="loading">Loading the market…</p></main>
<footer class="wrap">Personal screening tool. Not investment advice. Prices: NSE/BSE close files and Upstox minute prices; economy: MoSPI, RBI, FRED; news: Google News.</footer>

<script id="portal-data" type="application/json">__PORTAL_DATA__</script>
<script>
"use strict";
const S = { stocks: null, byIsin: {}, indices: [], industries: {}, economy: [], meta: {}, stats: null, news: null, charts: {} };
const view = { q: "", ex: "all", sort: "t", desc: true, page: 0, range: 366 };
const PAGE = 50;

// ---------- helpers
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const NA = "not available";
const inr = new Intl.NumberFormat("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const int = new Intl.NumberFormat("en-IN");
const price = (v) => (v == null ? NA : inr.format(v));
const cr = (v) => (v == null ? NA : inr.format(v / 1e7));
const vol = (v) => (v == null ? NA : int.format(v));
const pct = (v) => (v == null ? NA : `${v > 0 ? "+" : ""}${Number(v).toFixed(2)}%`);
const cls = (v) => (v == null ? "flat" : v > 0 ? "up" : v < 0 ? "down" : "flat");
function when(v) {
  if (!v) return NA;
  const d = new Date(v.length === 10 ? v + "T00:00:00" : v);
  if (isNaN(d)) return esc(v);
  const date = d.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
  return v.length === 10 ? date : `${date}, ${d.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Kolkata" })} IST`;
}
const safeUrl = (u) => (typeof u === "string" && u.startsWith("https://") ? u : null);

// Current price for a stock: today's minute price when trading, else the exchange close
function cur(s) { return s.lp != null ? { p: s.lp, ch: s.lch, at: s.lt, live: true, src: "Upstox minute prices" } : { p: s.c, ch: s.ch, at: s.d, live: false, src: s.src }; }

function spark(points, w = 96, h = 26) {
  if (!points || points.length < 2) return `<span class="tiny">—</span>`;
  const v = points.map((p) => p[1]), lo = Math.min(...v), hi = Math.max(...v), span = hi - lo || 1;
  const xy = v.map((y, i) => [(i / (v.length - 1)) * (w - 4) + 2, h - 3 - ((y - lo) / span) * (h - 6)]);
  const d = xy.map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`).join("");
  const [ex, ey] = xy[xy.length - 1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="trend"><path d="${d}" fill="none" stroke="var(--muted)" stroke-width="1.5"/><circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="2.2" fill="var(--accent)"/></svg>`;
}

// ---------- routing
const routes = { market: renderMarket, investing: renderInvesting, industries: renderIndustries, economy: renderEconomy, trading: renderTrading };
function route() {
  const h = location.hash.slice(1) || "market";
  document.querySelectorAll("nav.tabs a").forEach((a) => a.toggleAttribute("aria-current", false));
  const tab = h.startsWith("stock-") ? "market" : h.startsWith("industry-") ? "industries" : h;
  const cur = document.querySelector(`nav.tabs a[data-tab="${tab}"]`); if (cur) cur.setAttribute("aria-current", "page");
  if (!S.stocks) return;
  if (h.startsWith("stock-")) renderStock(h.slice(6));
  else if (h.startsWith("industry-")) renderIndustry(h.slice(9));
  else (routes[h] || renderMarket)();
  if (!h.startsWith("market") || view.page === 0) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
const app = () => document.getElementById("app");

// ---------- market
function renderMarket() {
  const rows = S.stocks;
  const tiles = S.indices.map((t) => `
    <div class="tile"><div class="lbl"><span>${esc(t.label)}</span>${t.date && t.date.length > 10 ? '<span class="live-dot" title="today\'s price"></span>' : ""}</div>
    <div class="val">${price(t.close)}</div><div class="small ${cls(t.change_pct)}">${pct(t.change_pct)}</div>
    <div class="tiny">${when(t.date)}</div></div>`).join("");
  const liquid = rows.filter((s) => (s.t || 0) >= 1e7 && cur(s).ch != null).sort((a, b) => cur(b).ch - cur(a).ch);
  const mv = (list) => list.map((s) => `<li><span><span class="name"><a href="#stock-${esc(s.i)}">${esc(s.s)}</a></span> <span class="tiny">₹${cr(s.t)} Cr</span></span><span class="num">${price(cur(s).p)} <span class="${cls(cur(s).ch)}">${pct(cur(s).ch)}</span></span></li>`).join("");
  app().innerHTML = `
    <div class="grid tiles">${tiles}</div>
    <div class="two">
      <section class="panel movers"><h2>Top gainers</h2><ol>${mv(liquid.slice(0, 5))}</ol></section>
      <section class="panel movers"><h2>Top losers</h2><ol>${mv(liquid.slice(-5).reverse())}</ol></section>
    </div>
    <p class="tiny" style="margin:-6px 0 0">Gainers and losers: stocks with at least ₹1 crore traded in the last full session.</p>
    <section class="panel">
      <div class="controls">
        <input type="search" id="q" placeholder="Search by company, symbol or ISIN" value="${esc(view.q)}" aria-label="Search stocks">
        <select id="ex" aria-label="Exchange">
          <option value="all">NSE + BSE</option><option value="nse">Listed on NSE</option><option value="bse">BSE only</option>
        </select>
        <span class="tiny" id="count"></span>
      </div>
      <div class="scroll"><table><thead><tr>
        <th><button data-k="s">Stock</button></th><th class="num"><button data-k="p">Price (₹)</button></th>
        <th class="num"><button data-k="ch">Change</button></th><th class="num"><button data-k="v">Volume*</button></th>
        <th class="num"><button data-k="t">Traded ₹ Cr*</button></th><th>As of</th></tr></thead><tbody id="tb"></tbody></table></div>
      <div class="pager"><button class="btn" id="prev">Previous</button><span class="tiny" id="pg"></span><button class="btn" id="next">Next</button></div>
      <p class="src">* Volume and value traded are from the last full session. Click a stock for its full analysis.</p>
    </section>`;
  document.getElementById("ex").value = view.ex;
  document.getElementById("q").addEventListener("input", (e) => { view.q = e.target.value; view.page = 0; drawTable(); });
  document.getElementById("ex").addEventListener("change", (e) => { view.ex = e.target.value; view.page = 0; drawTable(); });
  document.querySelectorAll("th button").forEach((b) => b.addEventListener("click", () => {
    const k = b.dataset.k; view.desc = view.sort === k ? !view.desc : k !== "s"; view.sort = k; view.page = 0; drawTable();
  }));
  document.getElementById("prev").addEventListener("click", () => { view.page--; drawTable(); });
  document.getElementById("next").addEventListener("click", () => { view.page++; drawTable(); });
  drawTable();
}
function drawTable() {
  const q = view.q.trim().toLowerCase();
  let rows = S.stocks;
  if (view.ex === "nse") rows = rows.filter((s) => s.x.includes("NSE"));
  if (view.ex === "bse") rows = rows.filter((s) => !s.x.includes("NSE"));
  if (q) rows = rows.filter((s) => s.s.toLowerCase().includes(q) || s.n.toLowerCase().includes(q) || s.i.toLowerCase() === q);
  const key = { s: (s) => s.s, p: (s) => cur(s).p, ch: (s) => cur(s).ch, v: (s) => s.v, t: (s) => s.t }[view.sort];
  const dir = view.desc ? -1 : 1;
  rows = [...rows].sort((a, b) => {
    const x = key(a), y = key(b);
    if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
    return (typeof x === "string" ? x.localeCompare(y) : x - y) * dir;
  });
  const pages = Math.max(1, Math.ceil(rows.length / PAGE)); view.page = Math.min(Math.max(view.page, 0), pages - 1);
  const shown = rows.slice(view.page * PAGE, view.page * PAGE + PAGE);
  document.getElementById("tb").innerHTML = shown.map((s) => { const c = cur(s); return `<tr>
    <td><div class="name"><a href="#stock-${esc(s.i)}">${esc(s.s)}</a><span class="ex">${esc(s.x.join(" · "))}</span></div><div class="co">${esc(s.n)}</div></td>
    <td class="num">${price(c.p)}</td><td class="num ${cls(c.ch)}">${pct(c.ch)}</td><td class="num">${vol(s.v)}</td><td class="num">${cr(s.t)}</td>
    <td class="tiny" title="Source: ${esc(c.src || NA)}">${c.live ? '<span class="live-dot"></span>' : ""}${when(c.at)}</td></tr>`; }).join("")
    || `<tr><td colspan="6" class="tiny">No stocks match.</td></tr>`;
  document.getElementById("count").textContent = `${int.format(rows.length)} stocks`;
  document.getElementById("pg").textContent = `Page ${view.page + 1} of ${pages}`;
  document.getElementById("prev").disabled = view.page === 0;
  document.getElementById("next").disabled = view.page >= pages - 1;
}

// ---------- economy panel (shared)
function macroPanel(m, title) {
  const s = m.score;
  const rows = m.drivers.map((d) => `<tr>
    <td><div class="name">${esc(d.label)}</div><div class="small">${esc(d.why || "")}</div><div class="tiny">Helps when ${esc(d.good_when || "")}. Source: ${esc(d.source)}</div></td>
    <td class="num">${esc(d.latest_text || NA)}<div class="tiny">${d.latest_date ? when(d.latest_date) : ""}</div></td>
    <td>${spark(d.trend)}<div class="tiny">${esc(d.change_text || "")}</div></td>
    <td><span class="pill ${esc(d.verdict === "not available" ? "na" : d.verdict)}">${esc(d.verdict)}</span><div class="tiny">${esc(d.summary || "")}</div></td></tr>`).join("");
  return `<section class="panel"><h2>${esc(title)}</h2>
    <p class="sub">${s.tailwinds} tailwind${s.tailwinds === 1 ? "" : "s"}, ${s.headwinds} headwind${s.headwinds === 1 ? "" : "s"}, ${s.judged - s.tailwinds - s.headwinds} neutral, out of ${s.judged} drivers</p>
    <div class="scroll"><table style="min-width:640px"><thead><tr><th>Driver</th><th class="num">Latest</th><th>Last 12 months</th><th>Verdict</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${m.not_tracked && m.not_tracked.length ? `<p class="src">Also matters, no free data: ${esc(m.not_tracked.join("; "))}.</p>` : ""}</section>`;
}
function newsPanel(items, title) {
  const li = (items || []).map((n) => { const u = safeUrl(n.link); return `<li><span class="pill ${esc(n.sentiment)}">${esc(n.sentiment)}</span><div>${u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(n.title)}</a>` : esc(n.title)}<div class="tiny">${esc(n.publisher || "")} · ${when(n.published)}</div></div></li>`; }).join("");
  return `<section class="panel news"><h2>${esc(title)}</h2><p class="sub">Tagged by simple word rules. Read the article before acting on it.</p>
    ${li ? `<ul>${li}</ul>` : `<p class="small">News for this company is not in the current update (news is collected for the 250 most traded stocks).</p>`}<p class="src">Source: Google News</p></section>`;
}
function peersTable(list, highlight) {
  return `<div class="scroll"><table style="min-width:560px"><thead><tr><th>Company</th><th class="num">Price (₹)</th><th class="num">Change</th><th class="num">Traded ₹ Cr</th><th>Sector</th></tr></thead><tbody>${

function drawChart(series) {
  const pts = series.map(([d, v]) => [new Date(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8)), v]);
  const last = pts[pts.length - 1][0], from = new Date(last - view.range * 864e5);
  const p = pts.filter((x) => x[0] >= from); if (p.length < 2) { document.getElementById("chart").innerHTML = `<p class="small">Not enough history.</p>`; return; }
  const W = 760, H = 260, L = 8, R = 64, T = 10, B = 26;
  const vals = p.map((x) => x[1]), lo = Math.min(...vals), hi = Math.max(...vals), pad = (hi - lo) * 0.06 || 1;
  const y0 = lo - pad, y1 = hi + pad, t0 = p[0][0], t1 = p[p.length - 1][0];
  const X = (t) => L + ((t - t0) / (t1 - t0 || 1)) * (W - L - R), Y = (v) => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const line = p.map(([t, v], i) => `${i ? "L" : "M"}${X(t).toFixed(1)},${Y(v).toFixed(1)}`).join("");
  const area = `${line}L${X(t1).toFixed(1)},${H - B}L${X(t0).toFixed(1)},${H - B}Z`;
  const ticks = [0, 1, 2, 3].map((i) => y0 + ((y1 - y0) * (i + 0.5)) / 4);
  const fmtD = (d) => d.toLocaleDateString("en-IN", view.range > 400 ? { month: "short", year: "numeric" } : { day: "numeric", month: "short" });
  const xt = [0, 0.33, 0.66, 1].map((f) => new Date(+t0 + (t1 - t0) * f));
  const up = vals[vals.length - 1] >= vals[0];
  document.getElementById("chart").innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Share price chart">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)"/><text x="${W - R + 6}" y="${(Y(v) + 4).toFixed(1)}" font-size="11" fill="var(--muted)" font-family="var(--mono)">${inr.format(v)}</text>`).join("")}
    ${xt.map((d, i) => `<text x="${X(d).toFixed(1)}" y="${H - 8}" font-size="11" fill="var(--muted)" text-anchor="${i === 0 ? "start" : i === 3 ? "end" : "middle"}">${fmtD(d)}</text>`).join("")}
    <path d="${area}" fill="url(#g)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="1.8"/>
    <circle cx="${X(t1).toFixed(1)}" cy="${Y(vals[vals.length - 1]).toFixed(1)}" r="3.5" fill="var(--accent)"/></svg>
    <p class="tiny" style="margin:4px 0 0">${pct(((vals[vals.length - 1] / vals[0]) - 1) * 100)} over this period <span class="${up ? "up" : "down"}">${up ? "▲" : "▼"}</span></p>`;
}

// ---------- candlestick chart + patterns from the hourly refresh
function techStock(isin) {
  const T = S.tech || {}; const t = (T.stocks || {})[isin]; if (!t) return null;
  if (!t._ready) {  // expand the compact form once
    const pat = (arr) => arr.map(([date, pattern, at]) => ({ date, pattern, price: at, meaning: (T.meanings || {})[pattern] || "" }));
    t.patterns = pat(t.patterns);
    t._bars = t.bars.map((b, i) => (b ? [T.calendar[i], ...b] : null)).filter(Boolean);
    t.w.patterns = pat(t.w.patterns);
    t.w._bars = t.w.bars.map((b) => ["20" + b[0].slice(0, 2) + "-" + b[0].slice(2, 4) + "-" + b[0].slice(4, 6), ...b.slice(1)]);
    t._ready = true;
  }
  return t;
}
function techQ(isin, view) {
  const t = techStock(isin); if (!t) return null;
  const v = view === "weekly" ? t.w : t;
  const kind = (arr, k) => arr.map((l) => ({ ...l, kind: k }));
  return { chart: view === "weekly" ? t.w._bars : t._bars,
           technicals: { supports: kind(v.supports, "support"), resistances: kind(v.resistances, "resistance") },
           structure: { fibonacci: v.fib, trend_lines: v.trend_lines, chart_patterns: v.chart_patterns, candles: v.patterns }, recent: view === "weekly" ? 12 : 30 };
}
let candleView = "daily";
function candleSection(isin) {
  const t = techStock(isin);
  if (!t) return `<section class="panel"><h2>Candlestick chart</h2><p class="small">The marked candle chart is prepared for the 300 most traded stocks. For this one, press “Analyse now” above to build it live.</p></section>`;
  return `<section class="panel"><h2>Candlestick chart and patterns</h2>
    <div class="ranges" id="cview"><button class="btn ${candleView === "daily" ? "on" : ""}" data-v="daily">Daily · 1 year</button><button class="btn ${candleView === "weekly" ? "on" : ""}" data-v="weekly">Weekly · 2 years</button></div>
    <div class="chart" id="candlechart"></div><div id="candleinfo"></div></section>`;
}
function candleInfo(isin) {
  const t = techStock(isin), wk = candleView === "weekly", v = wk ? t.w : t, el = document.getElementById("candleinfo"); if (!el) return;
  const lv = (a) => (a.length ? a.map((l) => `₹${price(l.level)} <span class="tiny">(${l.touches}×, ${pct(l.distance_pct)})</span>`).join("<br>") : NA);
  const pats = v.patterns.slice().reverse();
  el.innerHTML = `<p class="sub">${wk ? "104 weekly candles (2 years): the bigger trend and the major levels." : "250 daily sessions (1 year): levels, trend lines and Fibonacci are measured over the year; patterns over the last 30 sessions."} Weekly trend: ${esc(t.weekly)}. Updated ${when(S.meta.generated_at)}.</p>
    <div class="grid kv" style="margin-top:8px">${kv("Support", lv(v.supports))}${kv("Resistance", lv(v.resistances))}
      ${v.fib ? kv("Fibonacci", `${v.fib.levels.map((l) => `${l.ratio}: ₹${price(l.price)}`).join("<br>")}`) : ""}
      ${wk ? "" : kv("20 / 50 / 200-day avg", `${price(t.ma.sma20)} / ${price(t.ma.sma50)} / ${price(t.ma.sma200)}`)}
      ${wk ? "" : kv("RSI · ATR · volume", `${t.rsi ?? NA} · ${t.atr_pct ?? NA}% · ${t.volume_ratio ?? NA}×`)}
      ${!wk && t.pivots ? kv("Pivot / R1 / S1", `${price(t.pivots.pivot)} / ${price(t.pivots.r1)} / ${price(t.pivots.s1)}`) : ""}</div>
    ${v.fib ? `<p class="small">${esc(v.fib.reading)}</p>` : ""}
    ${v.trend_lines.length ? `<ul class="small">${v.trend_lines.map((tl) => `<li>Trend line: ${esc(tl.kind)} from ₹${price(tl.from.price)} (${esc(tl.from.date)}) through ₹${price(tl.to.price)} (${esc(tl.to.date)}), ${tl.touches} touches, now ₹${price(tl.value_now)}</li>`).join("")}</ul>` : ""}
    ${v.chart_patterns.length ? `<ul class="small">${v.chart_patterns.map((p) => `<li>${esc(p.pattern)} at ₹${price(p.level)}, neckline ₹${price(p.neckline)}: ${esc(p.meaning)}</li>`).join("")}</ul>` : ""}
    <details class="sec" open><summary>Candlestick patterns in the last ${wk ? "12 weeks" : "30 sessions"} (${pats.length})</summary>
      ${pats.length ? `<div class="scroll"><table><thead><tr><th>${wk ? "Week of" : "Date"}</th><th>Pattern</th><th>What it means</th><th class="num">At</th><th>Near a key level?</th></tr></thead><tbody>${pats.map((p) => { const near = [...v.supports, ...v.resistances].find((l) => Math.abs(p.price / l.level - 1) <= 0.015) || (v.fib && v.fib.levels.find((l) => Math.abs(p.price / l.price - 1) <= 0.015)); return `<tr><td class="tiny">${esc(p.date)}</td><td><b>${esc(p.pattern)}</b></td><td class="small">${esc(p.meaning)}</td><td class="num">₹${price(p.price)}</td><td class="small">${near ? `yes, ₹${price(near.level ?? near.price)}` : "—"}</td></tr>`; }).join("")}</tbody></table></div>` : `<p class="small">No classic candlestick patterns in this window.</p>`}
      <p class="tiny">A pattern carries more weight when it forms at a marked support/resistance, trend line or Fibonacci level, on higher volume, and in line with the weekly trend. Facts, not buy/sell signals.</p></details>
    ${wk ? "" : `<ul class="small">${t.observations.map((o) => `<li>${esc(o)}</li>`).join("")}</ul>`}`;
}
function drawCandles(isin) {

}

// ---------- live analysis (db + Claude Code Remote connector)
const ANALYST_TRIGGER = "trig_01HnnKsTAojbDkKoaoK3T4g4";
let DB = null, MCP = null, unsubLive = null;
const caps = (async () => {
  try { DB = await window.claude?.use?.("db"); } catch (e) { DB = null; }
  try { MCP = await window.claude?.use?.("mcp"); } catch (e) { MCP = null; }
})();
const ago = (iso) => { if (!iso) return ""; const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : when(iso); };

async function startJob(docPath, text, btn, body) {
  btn.disabled = true;
  try {
    await caps;
    if (!DB || !MCP) { body.innerHTML = `<p class="notice">Live analysis works when this page is opened on claude.ai while signed in (it uses your Claude account to start the analysis).</p>`; btn.disabled = false; return; }
    await DB.doc(docPath).set({ status: "queued", step: "Starting a Claude analysis session…", requested_at: new Date().toISOString() });
    await MCP.callTool("Claude Code Remote", "fire_trigger", { trigger_id: ANALYST_TRIGGER, text });
  } catch (e) {
    const code = e && e.code;
    const msg = code === "not_in_manifest" || code === "approval_required" ? "Allow the Claude Code Remote connector for this page when asked, then press the button again."
      : code === "server_not_connected" || code === "needs_reauth" ? "Connect the Claude Code Remote connector in claude.ai Settings → Connectors, then try again."
      : `Could not start the analysis (${esc(code || e.message || e)}).`;
    try { await DB.doc(docPath).set({ status: "failed", error: msg, updated_at: new Date().toISOString() }); } catch (_) { body.innerHTML = `<p class="notice">${msg}</p>`; }
    btn.disabled = false;
  }
}

function watchDoc(docPath, render) {
  if (unsubLive) { unsubLive(); unsubLive = null; }
  caps.then(() => {
    if (!DB) { render(null, "nodb"); return; }
    unsubLive = DB.doc(docPath).onSnapshot((snap) => render(snap.exists ? snap.data() : null), () => render(null, "error"));
  });
}

function liveReport(isin, s) {
  const btn = document.getElementById("analyse"), body = document.getElementById("live-body");
  btn.addEventListener("click", () => startJob(`reports/${isin}`, `ANALYSE ${isin} ${s.s}`, btn, body));
  watchDoc(`reports/${isin}`, (d, err) => {
    if (location.hash.slice(7) !== isin) return;
    if (err === "nodb") { body.innerHTML = `<p class="tiny">Open this page on claude.ai (signed in) to use live analysis.</p>`; return; }
    if (!d) { body.innerHTML = `<p class="tiny">No live analysis yet for ${esc(s.s)}. Press “Analyse now”.</p>`; btn.disabled = false; return; }
    const busy = d.status === "queued" || d.status === "working";
    btn.disabled = busy; btn.textContent = busy ? "Analysing…" : "Analyse again";
    let html = busy ? `<p class="steps"><span class="spinner"></span>${esc(d.step || "Working…")} <span class="tiny">(${ago(d.updated_at || d.requested_at)})</span></p>` : "";
    if (d.status === "failed") html += `<p class="notice">The analysis stopped: ${esc(d.error || "unknown error")}</p>`;
    if (d.quant) html += renderQuant(d.quant, d.framework);
    if (d.framework) html += renderFramework(d.framework);
    body.innerHTML = html;
    if (d.quant && d.quant.chart) drawTechChart(d.quant);
  });
}

function kv(k, v) { return `<div class="stat"><div class="k">${esc(k)}</div><div class="v">${v}</div></div>`; }
function renderQuant(q, fw) {
  const r = q.rating || {}, fr = (fw && fw.final_rating) || {};
  const grade = fr.grade || r.grade, score = fr.score ?? r.score;
  const t = q.technicals || {}, pos = q.positioning, mf = q.magic_formula || {}, iv = q.intrinsic_value || {}, v = q.valuation;
  const parts = Object.entries(r.parts || {}).map(([k, p]) => `<tr><td>${esc(k.replace("_", " "))}</td><td class="num">${p.score == null ? NA : Math.round(p.score * 100)}</td><td class="small">${esc(p.note)}</td></tr>`).join("");
  let h = `<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><span class="grade ${esc(grade || "")}">${esc(grade || "—")}</span>
    <div><div class="name">Rating ${score ?? NA}/100 ${fr.grade && fr.grade !== r.grade ? `<span class="tiny">(numbers alone: ${esc(r.grade)} ${r.score})</span>` : ""}</div>
    <div class="small">Live price ₹${price(q.live_price && q.live_price.price)} · ${esc(q.live_price && q.live_price.source)} · analysed ${ago(q.generated_at)}</div>
    ${fw && fw.summary ? `<p style="margin:6px 0 0">${esc(fw.summary)}</p>` : ""}</div></div>
    <details class="sec"><summary>How the rating is built</summary><div class="scroll"><table><tbody>${parts}</tbody></table></div><p class="tiny">${esc(r.note || "")}${fw && fw.rating_adjustment ? " Research adjustment: " + esc(fw.rating_adjustment.points) + " points — " + esc(fw.rating_adjustment.reason) : ""}</p></details>`;

  // Technicals
  if (t.available) {
    const lv = (arr) => (arr || []).map((l) => `₹${price(l.level)} <span class="tiny">(${l.touches} touch${l.touches === 1 ? "" : "es"}, ${pct(l.distance_pct)})</span>`).join("<br>") || NA;
    h += `<details class="sec" open><summary>Chart, levels and indicators (facts)</summary>
      <div class="chart" id="techchart"></div>
      <div class="grid kv">${kv("Support", lv(t.supports))}${kv("Resistance", lv(t.resistances))}
        ${kv("20 / 50 / 200-day avg", `${price(t.moving_averages.sma20)} / ${price(t.moving_averages.sma50)} / ${price(t.moving_averages.sma200)}`)}
        ${kv("RSI (14)", t.rsi14 ?? NA)}${kv("MACD / signal", t.macd ? `${t.macd.macd} / ${t.macd.signal}` : NA)}
        ${kv("ATR (14)", t.atr14 ? `₹${t.atr14} (${t.atr_pct}%)` : NA)}${kv("Bollinger", t.bollinger ? `${price(t.bollinger.lower)} – ${price(t.bollinger.upper)}` : NA)}
        ${kv("Volume vs 20-day avg", t.volume_ratio ? t.volume_ratio + "×" : NA)}
        ${kv("Pivot / R1 / S1", `${price(t.pivots.pivot)} / ${price(t.pivots.r1)} / ${price(t.pivots.s1)}`)}</div>
      <ul class="small">${(t.observations || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul><p class="tiny">${esc(t.note || "")}</p></details>`;
  }
  // Structure: Fibonacci, trend lines, patterns, weekly
  const st = q.structure;
  if (st) {
    const fb = st.fibonacci;
    h += `<details class="sec" open><summary>Chart structure: trend, Fibonacci, trend lines and patterns</summary>
      ${st.weekly ? `<p class="small"><b>Weekly trend:</b> ${esc(st.weekly.structure)} · 10-week avg ₹${price(st.weekly.sma10w)} · 40-week avg ₹${price(st.weekly.sma40w)}</p>` : ""}
      ${fb ? `<p class="small"><b>Fibonacci:</b> ${esc(fb.reading)}</p><div class="grid kv">${fb.levels.map((l) => kv(`Retracement ${l.ratio}`, "₹" + price(l.price))).join("")}${fb.extensions.map((l) => kv(`Extension ${l.ratio}`, "₹" + price(l.price))).join("")}</div>` : ""}

      ${(st.chart_patterns || []).length ? `<p class="small" style="margin-bottom:0"><b>Chart patterns</b></p><ul class="small">${st.chart_patterns.map((p) => `<li>${esc(p.pattern)} at ₹${price(p.level)} (${esc(p.points.join(" & "))}), neckline ₹${price(p.neckline)} — ${esc(p.meaning)}</li>`).join("")}</ul>` : ""}
      ${(st.candles || []).length ? `<p class="small" style="margin-bottom:0"><b>Candle patterns (last 30 sessions)</b></p><div class="scroll"><table><thead><tr><th>Date</th><th>Pattern</th><th>What it means</th></tr></thead><tbody>${st.candles.slice(-15).reverse().map((p) => `<tr><td class="tiny">${esc(p.date)}</td><td>${esc(p.pattern)}</td><td class="small">${esc(p.meaning)}</td></tr>`).join("")}</tbody></table></div>` : ""}
      <p class="tiny">Detected automatically from swing highs and lows; Claude checks them against the chart in the written analysis.</p></details>`;

    h += `<details class="sec" open><summary>Futures</summary><div class="grid kv">${q.futures.contracts.map((f) => kv(`Futures ${esc(f.expiry)}`, `₹${price(f.price)} <span class="tiny">(${f.basis >= 0 ? "premium" : "discount"} ₹${price(Math.abs(f.basis))}, ${pct(f.basis_pct)}) · lot ${vol(f.lot_size)}</span>`)).join("")}</div></details>`;

  }
  // Options & trade idea
  if (q.fno && q.fno.has_fno) {
    const oc = q.option_chain || {};
    h += `<details class="sec" open><summary>Levels and option-market positioning</summary>`;
    if (pos) h += setupBlock(pos);
    if (oc.available) {
      h += `<p class="small">${(oc.reading || []).map(esc).join(" ")} Max pain ₹${price(oc.max_pain)} · ATM implied volatility ${oc.atm_iv ?? NA}% · expiry ${esc(oc.expiry)}</p>
        <div class="scroll"><table style="min-width:560px"><thead><tr><th class="num">Call price</th><th class="num">Call OI</th><th class="num">Strike</th><th class="num">Put price</th><th class="num">Put OI</th></tr></thead><tbody>${(oc.strikes || []).map((r) => `<tr${r.strike === oc.atm_strike ? ' style="background:var(--soft)"' : ""}><td class="num">${price(r.ce_ltp)}</td><td class="num">${vol(r.ce_oi)}</td><td class="num"><b>${r.strike}</b></td><td class="num">${price(r.pe_ltp)}</td><td class="num">${vol(r.pe_oi)}</td></tr>`).join("")}</tbody></table></div>`;
    }
    h += `</details>`;
  }
  // Commodity & market links
  if ((q.links || []).length) {
    h += `<details class="sec"><summary>Links to commodities, the rupee and the market</summary><div class="scroll"><table><thead><tr><th>Factor</th><th class="num">Correlation</th><th>Reading</th><th>Period</th></tr></thead><tbody>${q.links.map((l) => `<tr><td>${esc(l.factor)}</td><td class="num ${cls(l.correlation)}">${l.correlation}</td><td class="small">${esc(l.reading)}</td><td class="tiny">${esc(l.period)}</td></tr>`).join("")}</tbody></table></div><p class="tiny">Correlation runs from −1 (moves opposite) to +1 (moves together). Sources: Upstox prices, FRED.</p></details>`;
  }
  // Fundamentals
  const f = q.financials;
  if (f) {
    const rows = f.periods.slice(0, 5);
    const line = (name, fn) => `<tr><td>${name}</td>${rows.map((x) => `<td class="num">${fn(x)}</td>`).join("")}${(q.projection.years || []).slice(0, 2).map((p) => `<td class="num tiny">${name === "Revenue (₹ Cr)" ? int.format(p.revenue) : name === "Net profit (₹ Cr)" ? (p.net_profit != null ? int.format(p.net_profit) : NA) : name === "EPS (₹)" ? (p.eps ?? NA) : ""}</td>`).join("")}</tr>`;
    h += `<details class="sec" open><summary>Financials, ratios and projection</summary><div class="scroll"><table style="min-width:640px"><thead><tr><th></th>${rows.map((x) => `<th class="num">${esc(x.period)}</th>`).join("")}${(q.projection.years || []).slice(0, 2).map((p) => `<th class="num">${esc(p.period)}</th>`).join("")}</tr></thead><tbody>
      ${line("Revenue (₹ Cr)", (x) => x.revenue != null ? int.format(x.revenue) : NA)}${line("Operating profit (₹ Cr)", (x) => x.operating_profit != null ? int.format(x.operating_profit) : NA)}${line("Net profit (₹ Cr)", (x) => x.net_profit != null ? int.format(x.net_profit) : NA)}${line("EPS (₹)", (x) => x.eps ?? NA)}
      ${line("Net margin", (x) => x.net_margin_pct != null ? x.net_margin_pct + "%" : NA)}${line("Return on equity", (x) => x.roe_pct != null ? x.roe_pct + "%" : NA)}${line("Cash from ops ÷ profit", (x) => x.cfo_to_profit ?? NA)}${line("Current ratio", (x) => x.current_ratio ?? NA)}${line("Liabilities ÷ equity", (x) => x.liabilities_to_equity ?? NA)}</tbody></table></div>
      <p class="tiny">${esc(q.projection.method || "")} Projections are a trend extension, not a forecast.</p></details>`;

  if (v || iv.available || mf.applies !== undefined) {

      ${kv("Magic Formula", mf.available ? `ROC ${mf.roc_pct}% · EY ${mf.earnings_yield_pct}%` : esc(mf.reason || NA))}</div>
      ${iv.available ? `<p class="tiny">${esc(iv.method)}</p>` : ""}${mf.available ? `<p class="small">${esc(mf.verdict)} (rank ${mf.peer_rank} of ${mf.peer_count} among competitors). <span class="tiny">${esc(mf.note)}</span></p>` : ""}</details>`;
  }
  if (q.graham) {
    h += `<details class="sec"><summary>Graham's defensive investor checks</summary><ul class="small">${q.graham.map((g) => `<li><span class="pill ${g.status === "pass" ? "good" : g.status === "fail" ? "bad" : "na"}">${esc(g.status.replace("_", " "))}</span> <b>${esc(g.name)}</b>: ${esc(g.value || NA)} <span class="tiny">(${esc(g.rule)})${g.note ? " " + esc(g.note) : ""}</span></li>`).join("")}</ul></details>`;
  }
  if (q.shareholding) {
    const sh = q.shareholding;
    h += `<details class="sec"><summary>Shareholding</summary><div class="scroll"><table><thead><tr><th>Holder</th>${sh.periods.map((p) => `<th class="num">${esc(p)}</th>`).join("")}</tr></thead><tbody>${sh.rows.map((r) => `<tr><td>${esc(r.category)}</td>${r.values.map((x) => `<td class="num">${x.pct ?? "—"}%</td>`).join("")}</tr>`).join("")}</tbody></table></div></details>`;
  }
  if ((q.risks || []).length) h += `<details class="sec"><summary>Risks from the numbers</summary><ul class="small">${q.risks.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></details>`;
  return h;
}

function setupBlock(pos) {
  const L = pos.levels || {}, em = pos.expected_move;
  const lv = (a) => (a && a.length ? a.map((x) => "₹" + price(x)).join(", ") : NA);
  return `<div class="idea"><div class="grid kv">${kv("Support", lv(L.supports))}${kv("Resistance", lv(L.resistances))}
      ${L.pivots ? kv("Pivot / R1 / S1", `${price(L.pivots.pivot)} / ${price(L.pivots.r1)} / ${price(L.pivots.s1)}`) : ""}
      ${L.atr ? kv("Normal daily move (ATR)", `₹${price(L.atr)} (${L.atr_pct}%)`) : ""}
      ${em ? kv(`Expected range by ${esc(em.expiry)}`, `₹${price(em.low)} – ₹${price(em.high)} <span class="tiny">(±${em.pct}%)</span>`) : ""}
      ${L.max_pain != null ? kv("Max pain", "₹" + price(L.max_pain)) : ""}
      ${L.call_oi_wall != null ? kv("Most call OI / put OI", `₹${price(L.call_oi_wall)} / ₹${price(L.put_oi_wall)}`) : ""}</div>
    ${(pos.facts || []).length ? `<ul class="small">${pos.facts.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    <p class="tiny">${esc(pos.label || "")}</p></div>`;
}

function renderFramework(fw) {
  let h = "";
  const bp = fw.big_picture;
  if (bp) {
    const list = (t, a) => (a && a.length ? `<div><div class="q">${t}</div><ul class="small">${a.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>` : "");
    h += `<details class="sec" open><summary>Big picture</summary><div class="qa">
      ${bp.overview ? `<p>${esc(bp.overview)}</p>` : ""}
      ${bp.priced_in ? `<div><div class="q">What the market is pricing in</div><div class="a">${esc(bp.priced_in)}</div></div>` : ""}
      ${list("What is driving it now", bp.drivers)}${list("Bull case", bp.bull_case)}${list("Bear case", bp.bear_case)}
      ${list("Upcoming triggers", bp.catalysts)}${list("What to watch", bp.watch)}${list("What would change the view", bp.what_changes_view)}
    </div></details>`;
  }
  if (fw.management || fw.capital_allocation || fw.strategy) {
    h += `<div class="grid kv">${fw.management ? kv("Management", `${esc(fw.management.grade)}<div class="tiny">${esc(fw.management.reason)}</div>`) : ""}${fw.capital_allocation ? kv("Capital allocation", `${esc(fw.capital_allocation.grade)}<div class="tiny">${esc(fw.capital_allocation.reason)}</div>`) : ""}${fw.strategy ? kv("Strategy", esc(fw.strategy)) : ""}</div>`;
  }
  for (const sec of fw.sections || []) {
    h += `<details class="sec" open><summary>${esc(sec.title)}</summary><div class="qa">${(sec.items || []).map((it) => `<div><div class="q">${esc(it.question)}</div><div class="a">${esc(it.answer)}</div>${(it.sources || []).length ? `<div class="s">${it.sources.map((x) => { const u = safeUrl(x.url); return u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(x.title || u)}</a>` : esc(x.title); }).join(" · ")}</div>` : ""}</div>`).join("")}</div></details>`;
  }
  if (fw.chart_read) h += `<details class="sec" open><summary>Claude's reading of the chart</summary><p style="white-space:pre-wrap">${esc(fw.chart_read)}</p></details>`;
  if (fw.trade_view) h += `<details class="sec" open><summary>Trading context (analysis, not a recommendation)</summary><p>${esc(fw.trade_view)}</p></details>`;
  h += `<p class="tiny" style="font-weight:600">Screening and research output only. Not investment advice.</p>`;
  return h;
}

function drawTechChart(q, elId = "techchart") {
  const el = document.getElementById(elId); if (!el) return;
  const c = q.chart.map((r) => ({ d: r[0], o: r[1], h: r[2], l: r[3], c: r[4] }));
  const t = q.technicals, W = 760, H = 300, L = 8, R = 70, T = 10, B = 24;
  const st = q.structure || {}, fib = st.fibonacci, tls = st.trend_lines || [], cps = st.chart_patterns || [];
  const levels = [...(t.supports || []), ...(t.resistances || [])];
  const lo = Math.min(...c.map((x) => x.l), ...levels.map((l) => l.level)), hi = Math.max(...c.map((x) => x.h), ...levels.map((l) => l.level));
  const inR = (v) => v >= lo * 0.97 && v <= hi * 1.03;
  const pad = (hi - lo) * 0.04, y0 = lo - pad, y1 = hi + pad;
  const X = (i) => L + (i / (c.length - 1)) * (W - L - R), Y = (v) => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const bw = Math.max(1, (W - L - R) / c.length * 0.6);
  const candles = c.map((x, i) => { const up = x.c >= x.o, col = up ? "var(--up)" : "var(--down)"; return `<line x1="${X(i).toFixed(1)}" x2="${X(i).toFixed(1)}" y1="${Y(x.h).toFixed(1)}" y2="${Y(x.l).toFixed(1)}" stroke="${col}"/><rect x="${(X(i) - bw / 2).toFixed(1)}" y="${Y(Math.max(x.o, x.c)).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1, Math.abs(Y(x.o) - Y(x.c))).toFixed(1)}" fill="${col}"/>`; }).join("");
  const ma = (n) => { const pts = []; for (let i = n - 1; i < c.length; i++) { let s = 0; for (let j = i - n + 1; j <= i; j++) s += c[j].c; pts.push(`${pts.length ? "L" : "M"}${X(i).toFixed(1)},${Y(s / n).toFixed(1)}`); } return pts.join(""); };
  const lines = levels.map((l) => `<line x1="${L}" x2="${W - R}" y1="${Y(l.level).toFixed(1)}" y2="${Y(l.level).toFixed(1)}" stroke="${l.kind === "support" ? "var(--up)" : "var(--down)"}" stroke-dasharray="5 4" stroke-width="1.2"/><text x="${W - R + 4}" y="${(Y(l.level) + 4).toFixed(1)}" font-size="10.5" fill="${l.kind === "support" ? "var(--up)" : "var(--down)"}" font-family="var(--mono)">${inr.format(l.level)}</text>`).join("");
  const n = c.length, dates = c.map((x) => x.d);
  const fibs = fib ? fib.levels.filter((l) => inR(l.price)).map((l) => `<line x1="${L}" x2="${W - R}" y1="${Y(l.price).toFixed(1)}" y2="${Y(l.price).toFixed(1)}" stroke="var(--warn)" stroke-dasharray="1 3" stroke-width="1"/><text x="${L + 2}" y="${(Y(l.price) - 2).toFixed(1)}" font-size="9" fill="var(--warn)">Fib ${l.ratio}</text>`).join("") : "";
  const trend = tls.map((tl) => { const i1 = n - 1 - tl.from.bars_ago, x0 = Math.max(i1, 0); const y = (i) => tl.from.price + tl.slope_per_day * (i - i1); return `<line x1="${X(x0).toFixed(1)}" x2="${X(n - 1).toFixed(1)}" y1="${Y(y(x0)).toFixed(1)}" y2="${Y(y(n - 1)).toFixed(1)}" stroke="var(--accent)" stroke-width="1.6"/>`; }).join("");
  const necks = cps.filter((p) => inR(p.neckline)).map((p) => `<line x1="${L}" x2="${W - R}" y1="${Y(p.neckline).toFixed(1)}" y2="${Y(p.neckline).toFixed(1)}" stroke="#0ea5e9" stroke-dasharray="6 2 1 2" stroke-width="1"/>`).join("");
  const BEAR = ["Bearish engulfing", "Shooting star", "Evening star", "Three black crows", "Bearish marubozu", "Bearish harami", "Gap down"];
  const marks = (st.candles || []).filter((p) => dates.indexOf(p.date) >= n - (q.recent || 25)).map((p) => { const i = dates.indexOf(p.date), bear = BEAR.includes(p.pattern), y = bear ? Y(c[i].h) - 6 : Y(c[i].l) + 6; return `<path d="M${X(i).toFixed(1)},${y.toFixed(1)} l-3.5,${bear ? -6 : 6} h7 z" fill="${bear ? "var(--down)" : "var(--up)"}"><title>${esc(p.date)}: ${esc(p.pattern)} — ${esc(p.meaning)}</title></path>`; }).join("");
  const months = c.filter((x, i) => i === 0 || x.d.slice(5, 7) !== c[i - 1].d.slice(5, 7)).filter((_, i, arr) => i % Math.max(1, Math.ceil(arr.length / 8)) === 0);
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Candlestick chart with support, resistance, Fibonacci, trend lines and patterns">${fibs}${necks}${lines}${trend}${candles}${marks}
    <path d="${ma(50)}" fill="none" stroke="var(--accent)" stroke-width="1.4"/><path d="${ma(20)}" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 2"/>
    ${months.map((x) => `<text x="${X(c.indexOf(x)).toFixed(1)}" y="${H - 6}" font-size="10" fill="var(--muted)">${new Date(x.d).toLocaleDateString("en-IN", { month: "short", year: c[0].d.slice(0, 4) !== c[c.length - 1].d.slice(0, 4) ? "2-digit" : undefined })}</text>`).join("")}</svg>
    <p class="tiny">Daily candles. Green/red dashed = support/resistance · dotted gold = Fibonacci · solid green = trend lines · blue dash-dot = pattern necklines · ▲▼ = recent candlestick patterns (hover for names; listed below) · blue line = 50-candle average, dotted grey = 20-candle average (days on the daily chart, weeks on the weekly).</p>`;
}


// ---------- investing (fundamental scorecards from the page database)
let SCORES = null;
async function loadScores() {
  if (SCORES) return SCORES;
  await caps;
  if (!DB) return null;
  try {
    const [snap, meta] = await Promise.all([DB.collection("scores").limit(1000).get(), DB.doc("meta/scores").get()]);
    SCORES = { cards: snap.docs.map((d) => d.data()), meta: meta.exists ? meta.data() : {} };
    return SCORES;
  } catch (e) { return null; }
}
const gradeCls = (g) => (g === "A" || g === "B" ? "good" : g === "D" || g === "E" ? "bad" : "na");
function scoreTable(list, showIndustry) {
  const n = (v, suf = "") => (v == null ? "—" : `${v}${suf}`);
  return `<div class="scroll"><table style="min-width:980px"><thead><tr><th class="num">Rank</th><th>Company</th>${showIndustry ? "<th>Industry</th>" : ""}<th>Grade</th><th class="num">Score</th><th class="num">Quality</th><th class="num">Value</th><th class="num">Growth</th><th class="num">Owners</th><th class="num">Magic F.</th><th class="num">ROE</th><th class="num">ROCE</th><th class="num">P/E (sector)</th><th class="num">Cash ÷ profit</th><th class="num">Debt-ish*</th><th class="num">Promoter (chg)</th><th class="num">Graham</th></tr></thead><tbody>${
    list.map((c) => { const m = c.metrics || {}, s = c.scores || {}, mf = c.magic_formula || {}, gp = (c.graham || []).filter((x) => x.pass).length;
      return `<tr><td class="num">${c.rank ?? "—"}</td><td><div class="name"><a href="#stock-${esc(c.isin)}">${esc(c.symbol)}</a></div><div class="co">${esc(c.name || "")}</div></td>${showIndustry ? `<td class="small">${esc(c.industry_label || "")}</td>` : ""}
        <td><span class="pill ${gradeCls(c.grade)}">${esc(c.grade || "—")}</span></td><td class="num"><b>${n(c.composite)}</b></td><td class="num">${n(s.quality)}</td><td class="num">${n(s.value)}</td><td class="num">${n(s.growth)}</td><td class="num">${n(s.ownership)}</td>
        <td class="num">${mf.rank ? `${mf.rank}<span class="tiny">/${mf.of}</span>` : "—"}</td><td class="num">${n(m.roe, "%")}</td><td class="num">${n(m.roce, "%")}</td><td class="num">${n(m.pe)} <span class="tiny">(${n(m.pe_sector)})</span></td>
        <td class="num">${n(m.cfo_to_profit, "×")}</td><td class="num">${n(m.liabilities_to_equity, "×")}</td><td class="num">${m.promoter_pct ? `${m.promoter_pct}%` : "—"} <span class="tiny">${m.promoter_change != null ? `(${m.promoter_change > 0 ? "+" : ""}${m.promoter_change})` : ""}</span></td><td class="num">${gp}/${(c.graham || []).length}</td></tr>`; }).join("")}</tbody></table></div>
    <p class="tiny">Scores 0–100. Quality: ROE, ROCE, cash conversion, balance sheet, margins, profit record. Value: P/E, P/B, EV/EBITDA against the sector. Growth: revenue and profit growth. Owners: promoter stake trend. Magic F.: Greenblatt rank across all non-financial companies. *Debt-ish: total liabilities ÷ equity (debt is not reported separately). Source: Upstox fundamentals.</p>`;
}

const inv = { view: "all", industry: "", grade: "", nofin: false, q: "" };
function renderInvesting() {
  app().innerHTML = `<div><h1>Investing</h1><p class="sub">Long-term picks screened on fundamentals only: business quality, value, growth, ownership and the economic backdrop, plus Greenblatt's Magic Formula across all companies. Click a company and press “Analyse now” for the full framework report. Screening output, not investment advice.</p></div>
    <section class="panel"><div class="controls">
      <select id="iv-view" aria-label="View"><option value="all">Overall ranking</option><option value="mf">Magic Formula (Greenblatt)</option><option value="best">Top 3 in each industry</option><option value="graham">Passes most Graham tests</option></select>
      <select id="iv-ind" aria-label="Industry"><option value="">All industries</option>${Object.values(S.industries).map((i) => `<option value="${esc(i.id.replace(/-/g, "_"))}">${esc(i.label)}</option>`).join("")}</select>
      <select id="iv-grade" aria-label="Grade"><option value="">Any grade</option><option value="A">A only</option><option value="AB">A or B</option></select>
      <label class="small"><input type="checkbox" id="iv-nofin"> Hide banks & lenders</label>
      <input type="search" id="iv-q" placeholder="Search company" aria-label="Search"></div>
      <div id="iv-body"><p class="loading">Loading scorecards…</p></div></section>`;
  const sync = () => { inv.view = document.getElementById("iv-view").value; inv.industry = document.getElementById("iv-ind").value; inv.grade = document.getElementById("iv-grade").value; inv.nofin = document.getElementById("iv-nofin").checked; inv.q = document.getElementById("iv-q").value.trim().toLowerCase(); drawInvesting(); };
  ["iv-view", "iv-ind", "iv-grade", "iv-nofin"].forEach((id) => document.getElementById(id).addEventListener("change", sync));
  document.getElementById("iv-q").addEventListener("input", sync);
  document.getElementById("iv-view").value = inv.view; document.getElementById("iv-ind").value = inv.industry; document.getElementById("iv-grade").value = inv.grade; document.getElementById("iv-nofin").checked = inv.nofin;
  drawInvesting();
}
async function drawInvesting() {
  const body = document.getElementById("iv-body"); if (!body) return;
  const sc = await loadScores();
  if (!sc) { body.innerHTML = `<p class="notice">Scorecards are read from this page's database: open the page on claude.ai while signed in.</p>`; return; }
  if (!sc.cards.length) { body.innerHTML = `<p class="small">Scorecards are being built (the first run downloads financials for about 800 companies). Check back shortly.</p>`; return; }
  let list = sc.cards.filter((c) => c.composite != null);
  if (inv.industry) list = list.filter((c) => c.industry === inv.industry);
  if (inv.grade === "A") list = list.filter((c) => c.grade === "A");
  if (inv.grade === "AB") list = list.filter((c) => c.grade === "A" || c.grade === "B");
  if (inv.nofin) list = list.filter((c) => c.industry !== "banks" && c.industry !== "nbfc");
  if (inv.q) list = list.filter((c) => (c.symbol + " " + (c.name || "")).toLowerCase().includes(inv.q));
  let html = "";
  if (inv.view === "mf") {
    list = list.filter((c) => c.magic_formula && c.magic_formula.rank).sort((a, b) => a.magic_formula.rank - b.magic_formula.rank);
    html = `<p class="small">Greenblatt's method: rank every company on return on capital (ROCE) and on earnings yield (1 ÷ EV/EBITDA), add the two ranks, lowest total first. Banks, lenders and utilities are left out, as in the book. Greenblatt suggests holding a basket of 20–30 of these for a year, not picking one.</p>` + scoreTable(list.slice(0, 50), true);
  } else if (inv.view === "best") {
    const by = {}; list.sort((a, b) => b.composite - a.composite).forEach((c) => { (by[c.industry_label] = by[c.industry_label] || []).length < 3 && by[c.industry_label].push(c); });
    html = Object.entries(by).sort().map(([k, v]) => `<h2 style="margin-top:12px">${esc(k)}</h2>${scoreTable(v, false)}`).join("");
  } else if (inv.view === "graham") {
    list = list.filter((c) => (c.graham || []).length >= 4).sort((a, b) => (b.graham.filter((x) => x.pass).length / b.graham.length) - (a.graham.filter((x) => x.pass).length / a.graham.length) || b.composite - a.composite);
    html = `<p class="small">Companies passing the most of Graham's defensive-investor tests that the data allows (P/E ≤ 15, P/B ≤ 1.5 or P/E×P/B ≤ 22.5, current ratio ≥ 2, profit every year, adequate size).</p>` + scoreTable(list.slice(0, 50), true);
  } else {
    list.sort((a, b) => b.composite - a.composite);
    html = scoreTable(list.slice(0, 100), true);
  }
  const meta = sc.meta || {};
  body.innerHTML = html + `<p class="tiny">${esc(meta.method || "")} ${meta.generated_at ? "Scorecards updated " + ago(meta.generated_at) + "." : ""} ${esc(meta.label || "")}</p>`;
}

// ---------- trading tab (F&O scan)
function renderTrading() {
  app().innerHTML = `<div><h1>Market pulse</h1><p class="sub">Where something unusual is happening among the ${int.format(218)} stocks with futures & options: big moves, heavy volume, option build-ups, volatility spikes, key levels and 52-week extremes. Claude reads the news and explains the common threads. Facts and context, not recommendations.</p></div>
    <section class="live-box"><div class="live-head"><div><h2>Pulse check</h2><p class="sub">Runs live in about 3–5 minutes.</p></div><button class="btn primary" id="scan">Check the market now</button></div><div id="scan-body"></div></section>`;
  const btn = document.getElementById("scan"), body = document.getElementById("scan-body");
  btn.addEventListener("click", () => startJob("scans/latest", "SCAN", btn, body));
  watchDoc("scans/latest", (d, err) => {
    if (location.hash.slice(1) !== "trading") return;
    if (err === "nodb") { body.innerHTML = `<p class="tiny">Open this page on claude.ai (signed in) to run it.</p>`; return; }
    if (!d) { body.innerHTML = `<p class="tiny">Not run yet. Press “Check the market now”.</p>`; return; }
    const busy = d.status === "queued" || d.status === "working"; btn.disabled = busy; btn.textContent = busy ? "Working…" : "Check again";
    let h = busy ? `<p class="steps"><span class="spinner"></span>${esc(d.step || "Working…")}</p>` : "";
    if (d.status === "failed") h += `<p class="notice">It stopped: ${esc(d.error || "unknown error")}</p>`;
    const sc = d.scan;
    if (d.commentary) h += `<div class="idea"><div class="name">Claude's overview</div><p style="white-space:pre-wrap;margin:4px 0 0">${esc(d.commentary)}</p></div>`;
    if (sc && sc.notable) {
      h += `<p class="small">${sc.scanned} stocks checked ${ago(sc.generated_at)} · ${sc.breadth.up} up, ${sc.breadth.down} down.</p>`;
      h += sc.notable.map((x) => `<div class="idea" style="margin-top:8px"><div class="name"><a href="#stock-${esc(x.isin)}">${esc(x.symbol)}</a> ₹${price(x.price)} <span class="${cls(x.change_pct)}">${pct(x.change_pct)}</span></div>
        <ul class="small">${x.flags.map((f) => `<li>${esc(f)}</li>`).join("")}</ul>
        <p class="tiny">IV ${x.iv ?? NA}% · expected move to expiry ±${x.expected_move_pct ?? NA}% · put/call OI ${x.pcr ?? NA}</p>
        ${(x.headlines || []).length ? `<p class="tiny">News: ${x.headlines.map((n) => { const u = safeUrl(n.link); return u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(n.title)}</a>` : esc(n.title); }).join(" · ")}</p>` : ""}</div>`).join("");
      h += `<details class="sec"><summary>All F&O stocks</summary><div class="scroll"><table><thead><tr><th>Stock</th><th class="num">Price</th><th class="num">Change</th><th class="num">Volume vs normal</th><th class="num">IV</th><th class="num">Expected move</th></tr></thead><tbody>${sc.overview.map((x) => `<tr><td><a href="#stock-${esc(x.isin)}">${esc(x.symbol)}</a></td><td class="num">${price(x.price)}</td><td class="num ${cls(x.change_pct)}">${pct(x.change_pct)}</td><td class="num">${x.volume_ratio ?? NA}×</td><td class="num">${x.iv ?? NA}%</td><td class="num">±${x.expected_move_pct ?? NA}%</td></tr>`).join("")}</tbody></table></div></details>
        <p class="tiny" style="font-weight:600">${esc(sc.label)}</p>`;
    }
    body.innerHTML = h;
  });
}

// ---------- boot (all data is embedded in this page by the refresh job)
(function boot() {
  try {
    const D = JSON.parse(document.getElementById("portal-data").textContent);
    const { stocks, meta } = D;
    Object.assign(S, D);
    stocks.forEach((s) => (S.byIsin[s.i] = s));
    const live = stocks.some((s) => s.lp != null);
    document.getElementById("fresh").textContent = `Updated ${when(meta.generated_at)}${live ? " · today's prices" : ` · closing prices of ${when(meta.prices_as_of.NSE)}`}`;
    route();
  } catch (e) {
    app().innerHTML = `<section class="panel">The market data in this page could not be read (${esc(e.message)}).</section>`;
  }
})();
</script>
